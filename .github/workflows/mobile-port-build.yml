name: Mobile port APK (via TV fork)

# The mobile fork refuses to run workflows right now ("Actions has been disabled for this
# repository"), so this fork build runs from the TV repository instead: it checks the mobile port
# branch out of Judzim/NuvioMobile and builds it with the secrets this repository already holds.
# It is not part of any pull request.

on:
  push:
    branches:
      - mobile-port-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-port-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dfile.encoding=UTF-8 -Xmx3072m -XX:MaxMetaspaceSize=1024m
      KOTLIN_DAEMON_JVMARGS: -Xmx2048m -XX:MaxMetaspaceSize=512m
    steps:
      - name: Check out the mobile port branch
        uses: actions/checkout@v6
        with:
          repository: Judzim/NuvioMobile
          ref: simkl-rewatch-build-2
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode the keystore so every test APK keeps the same signature
        run: printf '%s' "${{ secrets.NUVIO_KEYSTORE_B64 }}" | base64 -d > nuvio-test.jks && ls -la nuvio-test.jks

      - name: Write runtime properties
        env:
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_APP_NAME: ${{ secrets.SIMKL_APP_NAME }}
          SIMKL_REDIRECT_URI: ${{ secrets.SIMKL_REDIRECT_URI }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
        run: |
          {
            if [ -n "$SIMKL_CLIENT_ID" ]; then echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID"; fi
            if [ -n "$SIMKL_APP_NAME" ]; then echo "SIMKL_APP_NAME=$SIMKL_APP_NAME"; fi
            if [ -n "$SIMKL_REDIRECT_URI" ]; then echo "SIMKL_REDIRECT_URI=$SIMKL_REDIRECT_URI"; fi
            if [ -n "$NUVIO_SUPABASE_URL" ]; then echo "NUVIO_SUPABASE_URL=$NUVIO_SUPABASE_URL"; fi
            if [ -n "$NUVIO_SUPABASE_ANON_KEY" ]; then echo "NUVIO_SUPABASE_ANON_KEY=$NUVIO_SUPABASE_ANON_KEY"; fi
            if [ -n "$NUVIO_SUPABASE_FALLBACK_URL" ]; then echo "NUVIO_SUPABASE_FALLBACK_URL=$NUVIO_SUPABASE_FALLBACK_URL"; fi
          } > local.properties
          wc -l local.properties

      - name: Compile host tests
        continue-on-error: true
        run: ./gradlew :composeApp:compileAndroidHostTest --stacktrace

      - name: Unit tests
        continue-on-error: true
        run: ./gradlew :composeApp:testAndroidHostTest --continue --stacktrace

      - name: Give the fork build its own package
        run: |
          sed -i 's|applicationId = "com.nuvio.app"|applicationId = "com.judzim.nuvio"|' androidApp/build.gradle.kts
          sed -i 's|<string name="app_name">Nuvio</string>|<string name="app_name">Nuvio Judzim</string>|' composeApp/src/androidMain/res/values/strings.xml
          grep -n 'applicationId = ' androidApp/build.gradle.kts
          grep -n 'app_name' composeApp/src/androidMain/res/values/strings.xml

      - name: Assemble release APK
        run: |
          ./gradlew :androidApp:assemblePlaystoreRelease --stacktrace \
            -x lintVitalPlaystoreRelease \
            -x lintVitalAnalyzePlaystoreRelease \
            -x lintVitalReportPlaystoreRelease \
            -Pandroid.injected.signing.store.file="$PWD/nuvio-test.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: mobile-port-release
          path: androidApp/build/outputs/apk/playstore/release/*.apk
          if-no-files-found: error
