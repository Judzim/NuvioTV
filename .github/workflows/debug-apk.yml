name: Debug APK

on:
  push:
    branches:
      - simkl-rewatch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble full debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dfile.encoding=UTF-8 -Xmx2560m -XX:MaxMetaspaceSize=768m
      KOTLIN_DAEMON_JVMARGS: -Xmx1792m -XX:MaxMetaspaceSize=512m
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write local runtime properties
        run: |
          printf '%s' "${{ secrets.NUVIO_KEYSTORE_B64 }}" | base64 -d > nuviotv.jks
          cat > local.properties <<EOF
          SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_APP_NAME=${{ secrets.SIMKL_APP_NAME }}
          NUVIO_RELEASE_STORE_FILE=../nuviotv.jks
          NUVIO_RELEASE_STORE_PASSWORD=${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS=${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD=${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          EOF
          # Remove lines whose secret was left empty so generated config falls back to defaults.
          sed -i '/^[A-Z_]*=$/d' local.properties
          ls -la nuviotv.jks

      - name: Assemble debug APK
        run: ./gradlew :app:assembleFullDebug --max-workers=2 --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-tv-full-debug
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
