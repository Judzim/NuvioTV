name: TV test APK

on:
  push:
    branches:
      - tv-apk-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Assemble the 32-bit release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dfile.encoding=UTF-8 -Xmx2560m -XX:MaxMetaspaceSize=768m
      KOTLIN_DAEMON_JVMARGS: -Xmx1792m -XX:MaxMetaspaceSize=512m
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode the keystore and write local runtime properties
        run: |
          printf '%s' "${{ secrets.NUVIO_KEYSTORE_B64 }}" | base64 -d > nuviotv.jks
          cat > local.properties <<EOF
          SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_APP_NAME=${{ secrets.SIMKL_APP_NAME }}
          NUVIO_SUPABASE_URL=${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY=${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL=${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          INTRODB_API_URL=${{ secrets.INTRODB_API_URL }}
          NUVIO_RELEASE_STORE_FILE=../nuviotv.jks
          NUVIO_RELEASE_STORE_PASSWORD=${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS=${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD=${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          EOF
          sed -i '/^[A-Z_]*=$/d' local.properties
          ls -la nuviotv.jks

      - name: Run the unit tests
        # The suite carries failures that predate this branch, so the report is what matters here and
        # the APK below still has to be assembled. Compare the count against a pristine dev run.
        continue-on-error: true
        run: ./gradlew :app:testFullDebugUnitTest --max-workers=2 --stacktrace

      - name: Assemble the per-ABI release APKs
        run: ./gradlew :app:assembleFullRelease --max-workers=2 --stacktrace

      - name: Keep only the 32-bit APK
        run: |
          ls -la app/build/outputs/apk/full/release/
          mkdir -p dist
          cp app/build/outputs/apk/full/release/*armeabi-v7a*.apk dist/nuvio-tv-rewatch-armeabi-v7a.apk
          ls -la dist/

      - name: Upload the 32-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-release-apk-v7a
          path: dist/*.apk
          if-no-files-found: error
